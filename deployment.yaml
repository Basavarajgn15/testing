apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-dev
  template:
    metadata:
      labels:
        app: web-dev
    spec:
      containers:
      - name: web-dev
        image: 186014908456.dkr.ecr.us-east-1.amazonaws.com/web-dev:latest
        ports:
        - containerPort: 80
